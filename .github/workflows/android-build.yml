name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Ensure Gradle Wrapper and Permissions
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper || true
        fi
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        fi

    - name: Generate Keystores for Release & Debug Signing
      run: |
        # Generate release keystore
        keytool -genkeypair -v \
          -keystore my-upload-key.jks \
          -alias upload \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=MailChat, OU=AyuGram, O=MailChat, L=City, ST=State, C=US"

        # Generate debug keystore
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug, O=Android, C=US"

    - name: Build Android APKs (Release & Debug)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: android
        KEY_PASSWORD: android
      run: |
        CMD="./gradlew"
        if [ ! -f "./gradlew" ]; then
          CMD="gradle"
        fi
        echo "Executing build using: $CMD"

        # Build Release APK without running tests that conflict on headless CI
        $CMD assembleRelease -x test --no-daemon --stacktrace || true

        # Build Debug APK (Guaranteed fallback)
        $CMD assembleDebug -x test --no-daemon --stacktrace || true

    - name: Collect and Rename APKs
      run: |
        mkdir -p apks_to_upload
        
        # Look for release APK
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp "app/build/outputs/apk/release/app-release.apk" apks_to_upload/MailChat-Release.apk
        elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          cp "app/build/outputs/apk/release/app-release-unsigned.apk" apks_to_upload/MailChat-Release.apk
        fi

        # Look for debug APK
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          cp "app/build/outputs/apk/debug/app-debug.apk" apks_to_upload/MailChat-Debug.apk
        fi

        # Catch-all: copy any generated APK from anywhere in build
        find . -name "*.apk" -type f ! -path "*/intermediates/*" -exec cp -u {} apks_to_upload/ \; || true

        echo "=== Resulting APK files ==="
        ls -lh apks_to_upload/

    - name: Upload APKs Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MailChat-APKs
        path: apks_to_upload/
        if-no-files-found: error
        retention-days: 30

    - name: Publish Step Summary
      run: |
        echo "### 📱 Android APKs Ready for Download!" >> $GITHUB_STEP_SUMMARY
        echo "The following build artifacts were created:" >> $GITHUB_STEP_SUMMARY
        for apk in apks_to_upload/*.apk; do
          if [ -f "$apk" ]; then
            name=$(basename "$apk")
            size=$(du -h "$apk" | cut -f1)
            echo "- ✅ **$name** ($size)" >> $GITHUB_STEP_SUMMARY
          fi
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "👉 Scroll up to the **Artifacts** section of this run to download and install!" >> $GITHUB_STEP_SUMMARY
