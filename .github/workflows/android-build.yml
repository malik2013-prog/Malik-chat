name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        fi

    - name: Run Unit Tests
      continue-on-error: true
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue
        else
          gradle testDebugUnitTest --no-daemon --stacktrace --continue
        fi

    - name: Assemble Release APK
      continue-on-error: true
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleRelease --no-daemon --stacktrace --continue
        fi

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mail-chat-release-apk
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
        retention-days: 14
